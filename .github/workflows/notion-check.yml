# Manual, read-only check that the NOTION_TOKEN secret exists and can read the Water Leads database.
# Prints only HTTP status codes and the integration's name. Deploys nothing and writes nothing.
name: Notion check (manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Notion key and database access
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB: eacec3dbd9a84c02b50df41271adb04a
        run: |
          if [ -z "$NOTION_TOKEN" ]; then echo "RESULT: no secret named NOTION_TOKEN"; exit 1; fi
          h=(-H "Authorization: Bearer $NOTION_TOKEN" -H "Notion-Version: 2022-06-28")
          me=$(curl -sS -o /tmp/me.json -w '%{http_code}' "${h[@]}" https://api.notion.com/v1/users/me)
          echo "users/me HTTP $me; integration name: $(jq -r '.name // "?"' /tmp/me.json)"
          q=$(curl -sS -o /tmp/q.json -w '%{http_code}' -X POST "${h[@]}" -H 'Content-Type: application/json' \
            -d '{"page_size":1}' "https://api.notion.com/v1/databases/$DB/query")
          echo "database query HTTP $q; $(jq -r '.code // "ok"' /tmp/q.json)"
          if [ "$q" = "200" ]; then echo "RESULT: key works and can read Water Leads"; else echo "RESULT: key cannot read Water Leads"; exit 1; fi
