# Manual, read-only. Pulls public data for the filtration screen (Clint, 2026-10-28: "Add a filtration screen"):
# ACS 2024 1-year tenure by year built (B25036) and owner households (B25003) for every place, and EPA UCMR 5
# PFOA/PFOS results by water system. Prints rows to the log; writes nothing anywhere.
name: Filtration screen data (manual)

on:
  workflow_dispatch:
    inputs:
      detail_only:
        description: 'Only print UCMR 5 PFOA/PFOS detail for the owned filtration cities'
        type: boolean
        default: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: EPA UCMR 5 PFOA and PFOS by system
        run: |
          curl -sSfL -A 'Mozilla/5.0' -o page.html 'https://www.epa.gov/dwucmr/occurrence-data-unregulated-contaminant-monitoring-rule'
          url=$(grep -oE 'https://www\.epa\.gov/system/files/[^"]*ucmr[-_]?5[^"]*\.zip' page.html | head -1)
          [ -z "$url" ] && url=$(grep -oE '/system/files/[^"]*ucmr[-_]?5[^"]*\.zip' page.html | head -1 | sed 's#^#https://www.epa.gov#')
          echo "UCMR5 URL $url"
          curl -sSfL -A 'Mozilla/5.0' -o u5.zip "$url" && unzip -o -q u5.zip -d u5 && ls -la u5
          python3 - <<'PY'
          import csv, glob, collections
          f = [p for p in glob.glob('u5/**/*', recursive=True) if 'All' in p and p.endswith('.txt')] or [p for p in glob.glob('u5/**/*.txt', recursive=True)]
          print('FILES', f)
          best = collections.defaultdict(lambda: {'PFOA': 0.0, 'PFOS': 0.0, 'n': 0})
          meta = {}
          for p in f:
              with open(p, encoding='latin-1') as fh:
                  rd = csv.DictReader(fh, delimiter='\t')
                  print('COLS', rd.fieldnames)
                  for r in rd:
                      c = r.get('Contaminant', '')
                      if c not in ('PFOA', 'PFOS'): continue
                      k = r['PWSID']; meta[k] = (r.get('PWSName', ''), r.get('State', ''), r.get('Size', ''))
                      best[k]['n'] += 1
                      if r.get('AnalyticalResultsSign') == '=':
                          try: v = float(r.get('AnalyticalResultValue') or 0) * (1000 if float(r.get('AnalyticalResultValue') or 0) < 1 else 1)
                          except ValueError: continue
                          best[k][c] = max(best[k][c], v)
              break
          for k, b in sorted(best.items()):
              name, st, size = meta[k]
              if size == 'L': print(f"UCMRROW|{k}|{st}|{name}|{b['PFOA']:.2f}|{b['PFOS']:.2f}|{b['n']}")
          PY
      - name: UCMR 5 detail for the owned filtration cities
        run: |
          python3 - <<'PY3'
          import csv, glob, collections
          ids = ['NY7003493','MI0001800','MD0300002','CO0116001','TX0570004','MA3035000','MN1270024','MO6010715','PA5020038','TX2200012','OH3102612']
          f = [p for p in glob.glob('u5/**/*', recursive=True) if 'All' in p and p.endswith('.txt')][0]
          d = collections.defaultdict(lambda: {'n': 0, 'det': [], 'mrl': set(), 'units': set(), 'dates': []})
          with open(f, encoding='latin-1') as fh:
              for r in csv.DictReader(fh, delimiter='\t'):
                  if r['PWSID'] not in ids or r.get('Contaminant') not in ('PFOA', 'PFOS'): continue
                  x = d[(r['PWSID'], r['Contaminant'])]
                  x['n'] += 1; x['mrl'].add(r.get('MRL', '')); x['units'].add(r.get('Units', '')); x['dates'].append(r.get('CollectionDate', ''))
                  if r.get('AnalyticalResultsSign') == '=': x['det'].append((r.get('AnalyticalResultValue'), r.get('CollectionDate'), r.get('FacilityName'), r.get('SamplePointName')))
          for (k, c), x in sorted(d.items()):
              ds = sorted(x['dates'], key=lambda s: s[-4:] + s[:5])
              print(f"UCMRDETAIL|{k}|{c}|samples={x['n']}|mrl={sorted(x['mrl'])}|units={sorted(x['units'])}|first={ds[0]}|last={ds[-1]}|detects={x['det']}")
          PY3
      - name: ACS tenure by year built, all places
        if: ${{ !inputs.detail_only }}
        continue-on-error: true
        run: |
          # api.census.gov now asks for a key, so this uses the data.census.gov table API.
          curl -sSL -o acs.json 'https://data.census.gov/api/access/data/table?id=ACSDT1Y2024.B25036&g=010XX00US$1600000'
          head -c 600 acs.json; echo
          python3 - <<'PY2'
          import json
          j = json.load(open('acs.json'))
          rows = j['response']['data'] if 'response' in j else j['data']
          head = rows[0]
          print('HEAD', head[:30])
          col = {h: i for i, h in enumerate(head)}
          old = ['B25036_010E', 'B25036_011E', 'B25036_012E']
          out = []
          for r in rows[1:]:
              try:
                  t = int(r[col['B25036_002E']] or 0); o = sum(int(r[col[k]] or 0) for k in old)
              except (ValueError, KeyError): continue
              out.append((o, t, r[col['NAME']], r[col['GEO_ID']]))
          for o, t, n, g in sorted(out, reverse=True)[:150]:
              print(f'ACSROW|{g}|{n}|{t}|{o}|{o / t if t else 0:.3f}')
          PY2
