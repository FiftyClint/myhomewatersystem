# Manual, read-only staging check. Reads each owned filtration city's staging preview and prints whether the
# lead line and PFAS sections are there, whether the page is noindex, and the first lead sentence. Writes nothing.
name: Staging filtration check (manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Filtration sections on staging
        run: |
          base=https://mhws-staging.clint-bfa.workers.dev/__site
          fail=0
          for d in nycwatersystems.com detroitwatersystems.com baltimorewatersystems.com denverwatersystems.com \
                   dallaswatersystems.com fortworthwatersystems.com bostonwatersystems.com minneapoliswatersystems.com \
                   stlouiswatersystems.com pittsburghwatersystems.com cincinnatiwatersystems.com; do
            code=$(curl -sS -L -o /tmp/p.html -w '%{http_code}' "$base/$d/" || echo 000)
            lead=$(grep -c 'id="lead"' /tmp/p.html || true); pfas=$(grep -c 'id="pfas"' /tmp/p.html || true)
            noidx=$(grep -c 'noindex' /tmp/p.html || true)
            first=$(grep -o 'id="lead">[^<]*</h2>[[:space:]]*<p>[^<]*' /tmp/p.html | sed 's/.*<p>//' | cut -c1-140)
            echo "$d HTTP $code lead=$lead pfas=$pfas noindex=$noidx | $first"
            if [ "$code" != "200" ] || [ "$lead" = "0" ] || [ "$pfas" = "0" ]; then fail=1; fi
          done
          exit $fail
