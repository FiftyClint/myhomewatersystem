# Manual deploy only. Nothing here runs on a push. Clint starts it from the Actions tab
# after he approves a deploy. Needs repository secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID. The D1 database IDs in wrangler.toml are real (created 2026-10-26).
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        required: true
        type: choice
        options: [staging, production]
      migrate:
        description: Apply D1 migrations first (turn off only when no migration is pending and D1 is over its daily limit)
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Stop if a D1 database ID is still a placeholder
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "wrangler.toml still has a placeholder D1 database ID. Create the databases and fill in the IDs first."
            exit 1
          fi
      - name: Apply D1 migrations
        if: ${{ inputs.migrate }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply mhws-${{ inputs.environment }} --remote --env ${{ inputs.environment }}
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            # Staging has no domain of its own. Its links point at its workers.dev address.
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            if [ -z "$sub" ] || [ "$sub" = "null" ]; then echo "No workers.dev subdomain on this account. Turn it on under Workers & Pages first."; exit 1; fi
            npx wrangler deploy --env staging --var "BASE_URL:https://mhws-staging.$sub.workers.dev"
          else
            npx wrangler deploy --env production
          fi
      - name: Set the Worker's own secrets
        # LINK_SECRET and HASH_PEPPER are made here once and never change after, because changing them
        # breaks dealer links already sent. ADMIN_TOKEN and CRM_WEBHOOK_SECRET come from GitHub secrets
        # of the same name when those exist, and are otherwise made here once. No value is printed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          GH_CRM_WEBHOOK_SECRET: ${{ secrets.CRM_WEBHOOK_SECRET }}
        run: |
          e="${{ inputs.environment }}"
          have=$(npx wrangler secret list --env "$e" --format json | jq -r '.[].name')
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --env "$e" > /dev/null; echo "set $1"; }
          for n in LINK_SECRET HASH_PEPPER ADMIN_TOKEN CRM_WEBHOOK_SECRET; do
            given=""
            [ "$n" = "ADMIN_TOKEN" ] && given="$GH_ADMIN_TOKEN"
            [ "$n" = "CRM_WEBHOOK_SECRET" ] && given="$GH_CRM_WEBHOOK_SECRET"
            if [ -n "$given" ]; then put "$n" "$given"
            elif ! printf '%s\n' "$have" | grep -qx "$n"; then put "$n" "$(openssl rand -hex 32)"
            else echo "kept $n"; fi
          done
      - name: Connect HighLevel (production only, once the HIGHLEVEL_TOKEN secret is saved)
        # The token is a HighLevel Private Integration Token from the My Home Water System sub-account.
        # Staging never receives it. Live CRM writes still need CRM_PROVIDER = "highlevel" in wrangler.toml
        # and the production policy switched on (src/env.ts chooseCrm); until then leads stay in the mock CRM.
        if: ${{ inputs.environment == 'production' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HIGHLEVEL_TOKEN: ${{ secrets.HIGHLEVEL_TOKEN }}
        run: |
          if [ -z "$HIGHLEVEL_TOKEN" ]; then echo "No HIGHLEVEL_TOKEN secret yet; skipping."; exit 0; fi
          loc=$(grep -o 'HIGHLEVEL_LOCATION_ID = "[^"]*"' wrangler.toml | cut -d'"' -f2)
          node --experimental-strip-types --no-warnings scripts/highlevel-pipeline.ts "$loc" > "$RUNNER_TEMP/hl.json"
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --env production > /dev/null; echo "set $1"; }
          put HIGHLEVEL_TOKEN "$HIGHLEVEL_TOKEN"
          put HIGHLEVEL_PIPELINE_ID "$(jq -r .pipelineId "$RUNNER_TEMP/hl.json")"
          put HIGHLEVEL_STAGE_MAP "$(jq -c .stageMap "$RUNNER_TEMP/hl.json")"
      - name: Check the Worker answers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            url="https://mhws-staging.$sub.workers.dev/healthz"
          else
            url="https://www.myhomewatersystem.com/healthz"
          fi
          for i in 1 2 3 4 5 6; do curl -fsS "$url" && exit 0; sleep 10; done
          echo "No answer from $url yet. For production this is expected until the domains are on Cloudflare."; exit 1
